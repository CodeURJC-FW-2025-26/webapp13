<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> 
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"> 
    <link rel="stylesheet" href="/css/styles_nuevo-elem.css" /> 
    <link rel="stylesheet" href="/css/style_footer.css">
    <link rel="stylesheet" href="/css/style_header.css">
    <link rel="stylesheet" href="/css/style_modal.css">
    <link rel="shortcut icon" href="/images/logo/logo.ico" type="image/x-icon">
    <title>Notfilm</title>
</head>
{{>header}}
<body>
<div class="container my-5"> 
  <div class="row justify-content-center"> 
    <div class="col-12 col-md-8 col-lg-6"> 
      <div class="form-container">
        
        <form id="serieForm" action="/serie/new" method="POST" enctype="multipart/form-data" onsubmit="checkSerieForm(event )" novalidate>
          
          <input type="hidden" id="serieIdInput" value="">

          <h1>Crear Serie</h1>
          
          <div class="form-group">
            <label for="titulo" class="form-label">Título</label>
            <input type="text" class="form-control" id="title" name="title" 
                  value="" placeholder="Nombre de la serie" required 
                  oninput="checkSerieTitle()" /> 
            <div id="messageSerieTitle" class="invalid-feedback"></div>
          </div>

          <div class="form-group">
            <label for="sinopsis" class="form-label">Sinopsis</label>
            <textarea class="form-control" id="synopsis" name="synopsis" placeholder="Breve descripción de la serie" rows="3" required
            oninput="checkSerieSynopsis()"></textarea> 
            <div id="messageSerieSynopsis" class="invalid-feedback"></div>
          </div>

          <div class="form-group">
              <label for="genero" class="form-label">Género</label>
              <select id="genre" name="genre" class="form-select" required onchange="checkSerieGenre()">
                  {{{genreOptions}}}
              </select>
              <div id="messageSerieGenre" class="invalid-feedback"></div>
          </div>

          <div class="form-group" id="cover">
              <label for="cover" class="form-label">Portada</label>
              <img id="coverPreviewSerie" src="#" alt="..."
                  style="display: none; max-width: 200px; max-height: 200px;">
              <br>
              <input type="file" name="image" class="form-control" id="coverInputSerie" oninput="checkSerieCover()"/>
              <button class="btn-default" onclick="deleteSerieCover()" style="display: none;" type="button"
                  id="deleteCoverButtonSerie">
                  Borrar imagen
              </button>
              <div id="messageCoverSerie"></div>
          </div>
          <div class="form-group">
            <label for="edad" class="form-label">Edad Requerida</label>
            <input type="number" class="form-control" name="ageClasification" id="age" 
                  value="" placeholder="Edad requerida" required oninput="checkSerieAge()"/> 
            <div id="messageSerieAge" class="invalid-feedback"></div>
          </div>

          <div class="form-group">
            <label for="temporadas" class="form-label">Temporadas</label>
            <input type="number" class="form-control" name="seasons" id="seasons" 
                   value="" placeholder="Número de temporadas" required oninput="checkSerieSeasons()"/> 
            <div id="messageSerieSeasons" class="invalid-feedback"></div>
          </div>

          <div class="form-group">
            <label for="año" class="form-label">Año de estreno</label>
            <input type="number" class="form-control" name="premiere" id="year" 
                   value="" placeholder="Año en el que se estrenó" required oninput="checkSeriePremiere()"/> 
            <div id="messageSeriePremiere" class="invalid-feedback"></div>
          </div>
          
          <div class="form-actions">
            
            <div class="spinnerSerie" id="spinner-loader-serie"></div>

            
            <button type="button" class="btn btn-volver" onclick="location.href='/'">Cancelar</button> 
            <button type="submit" class="btn btn-default">Crear Serie</button>   
          </div>

        </form>
      </div>
    </div>
  </div>
</div>

{{>modal}}

<script src="/app.js"></script>

{{>footer}}
</body>
</html>
