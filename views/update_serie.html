<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/styles_nuevo-elem.css" />
    <link rel="stylesheet" href="/css/style_footer.css">
    <link rel="stylesheet" href="/css/style_header.css">
    <link rel="stylesheet" href="/css/style_modal.css">
    <link rel="shortcut icon" href="/images/logo/logo.ico" type="image/x-icon">
    <title>Notfilm</title>
</head>
{{>header}}

<body>
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="form-container">
                    <form onsubmit="checkSerieFormUpdate(event,'{{serie._id}}')" enctype="multipart/form-data"
                        novalidate>
                        <h1>
                            Editar Serie
                        </h1>
                        <div class="form-group">
                            <label for="title" class="form-label">Título</label>
                            <input type="text" class="form-control" id="titleInputSerieUpdate" name="title"
                                value="{{serie.title}}" placeholder="Nombre de la serie"
                                oninput="checkTitleSerieUpdate('{{serie._id}}')" required />
                            <div id="messageTitleSerieUpdate"></div>

                        </div>

                        <div class="form-group">
                            <label for="synopsis" class="form-label">Sinopsis</label>
                            <textarea class="form-control" id="inputSynopsisSerieUpdate" name="synopsis"
                                placeholder="Breve descripción de la serie" rows="3"
                                oninput="checkSynopsisSerie('inputSynopsisSerieUpdate','messageSynopsisSerieUpdate')"
                                required>{{serie.synopsis}}</textarea>
                            <div id="messageSynopsisSerieUpdate"></div>
                        </div>

                        <div class="form-group">
                            <label for="genre" class="form-label">Género</label>
                            <select id="inputGenreSerieUpdate" name="genre" class="form-select"
                                oninput="checkSerieGenreUpdate()" required>
                                {{{genreOptions}}}
                            </select>
                            <div id="messageGenreSerieUpdate"></div>
                        </div>

                        <div class="form-group">
                            <label for="cover" class="form-label">Portada</label>
                            <img id="coverPreviewSerieUpdate" src="#" alt="..."
                                style="display: none; max-width: 200px; max-height: 200px;">
                            <input type="file" name="image" class="form-control" id="inputSerieCoverUpdate"
                                oninput="checkSerieCoverUpdate()" required />
                            <button type="button" id="deleteImageSerieUpdate" class="btn btn-default"
                                onclick="deleteCoverSerieUpdate()" style="display: none;">Borrar
                                Imagen</button>
                            <div id="messageCoverSerieUpdate"></div>
                        </div>

                        <div class="form-group">
                            <label for="ageClassification" class="form-label">Edad Requerida</label>
                            <input type="number" class="form-control" name="ageClassification"
                                id="inputAgeClassificationSerieUpdate" placeholder="Edad requerida"
                                value="{{serie.ageClassification}}" oninput="checkAgeClassificationUpdate()" required />
                            <div id="messageAgeClassificationSerieUpdate"></div>
                        </div>

                        <div class="form-group">
                            <label for="seasons" class="form-label">Temporadas</label>
                            <input type="number" class="form-control" name="seasons" id="inputSeasonsUpdate"
                                value="{{serie.seasons}}" placeholder="Número de temporadas"
                                oninput="checkSeasonUpdate()" required />
                            <div id="messageSeasonsSerieUpdate"></div>
                        </div>

                        <div class="form-group">
                            <label for="year" class="form-label">Año de estreno</label>
                            <input type="number" class="form-control" name="premiere" id="inputPremiereSerieUpdate"
                                value="{{serie.premiere}}" placeholder="Año en el que se estrenó"
                                oninput="checkPremiereUpdate()" required />
                            <div id="messagePremiereSerieUpdate"></div>
                        </div>

                        <div class="form-actions">
                            <button type="button" class="btn btn-volver" onclick="location.href='/'">Cancelar</button>
                            <button type="submit" class="btn btn-default">
                                Actualizar Serie
                            </button>
                        </div>
                        <div class="spinner" id="spinner-loader-update-serie"></div>

                    </form>
                </div>
            </div>
        </div>
    </div>
    {{>modal}}
    <script src="/app.js"></script>
</body>
{{>footer}}

</html>
